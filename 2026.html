<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Festival Franco-Mexicano</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(#cdb892,#e6d6b8);
}

.card{
  max-width:980px;
  margin:60px auto;
  background:#efe4cd;
  border-radius:22px;
  padding:86px 20px 30px;
  position:relative;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* LOGO ROND */
.logo-wrap{
  position:absolute;
  top:-70px;
  left:50%;
  transform:translateX(-50%);
  width:150px;
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
}

.logo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

/* TITRES */

h1{
  text-align:center;
  margin:10px 0 0;
  color:#24313c;
  font-size:42px;
}

.edition{
  text-align:center;
  color:#666;
  margin:10px 0 18px;
}

/* BOUTONS */

.btn{
  display:block;
  width:260px;
  margin:12px auto;
  text-align:center;
  background:#2f4050;
  color:#fff;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

/* bouton youtube */

.btn-youtube{
  background:#c4302b;
}

/* RÉSEAUX */

.social{
  text-align:center;
  margin:12px 0;
}

.social a{
  display:inline-block;
  background:#f3eadb;
  padding:8px 16px;
  margin:4px;
  border-radius:20px;
  text-decoration:none;
  color:#333;
}

/* EMAIL */

.email{
  text-align:center;
  font-size:13px;
  margin:10px 0 18px;
  color:#666;
}

/* GALERIE */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.ph{
  border-radius:14px;
  overflow:hidden;
  background:#ddd;
  aspect-ratio:16/9;
}

.ph img{
  width:100%;
  height:100%;
  object-fit:cover;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .logo-wrap{
    width:135px;
    height:135px;
    top:-63px;
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr;
  }

  .card{
    margin:50px 10px 20px;
    padding-top:78px;
  }

  .logo-wrap{
    width:120px;
    height:120px;
    top:-56px;
  }

  h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGO 20 -->
  <div class="logo-wrap">
    <img
      class="logo"
      src="LOGO-20-transparent.png"
      alt="20 Festival Franco-Mexicano"
    >
  </div>

  <h1>Festival Franco-Mexicano</h1>
  <div class="edition">20ª edición</div>

  <!-- PDF -->
  <a class="btn" href="P1 FEST.pdf" target="_blank">
    Boletín de Prensa (PDF)
  </a>

  <!-- YOUTUBE -->
  <a class="btn btn-youtube" href="festival_ffm_final_v3-1(1).mp4" target="_blank">
    Ver vídeo
  </a>

  <!-- RÉSEAUX -->
  <div class="social">
    <a href="https://www.instagram.com/festivalfrancomexicano" target="_blank">Instagram</a>
    <a href="https://x.com/festivalfrances" target="_blank">X</a>
    <a href="https://www.facebook.com/share/17njmKGrgN/" target="_blank">Facebook</a>
  </div>

  <div class="email">festival.frances@gmail.com</div>

  <div style="text-align:center;color:#666;margin-bottom:14px;">
    Galería de fotos
  </div>

  <!-- GALERIE -->
  <div class="grid">
    <div class="ph"><img src="galerie-01.jpg"></div>
    <div class="ph"><img src="galerie-02.jpg"></div>
    <div class="ph"><img src="galerie-03.jpg"></div>
    <div class="ph"><img src="galerie-04.jpg"></div>
    <div class="ph"><img src="galerie-05.jpg"></div>
    <div class="ph"><img src="galerie-06.jpg"></div>
    <div class="ph"><img src="galerie-07.jpg"></div>
    <div class="ph"><img src="galerie-08.jpg"></div>
    <div class="ph"><img src="galerie-09.jpg"></div>
    <div class="ph"><img src="galerie-10.jpg"></div>
    <div class="ph"><img src="galerie-11.jpg"></div>
    <div class="ph"><img src="galerie-12.jpg"></div>
    <div class="ph"><img src="galerie-13.jpg"></div>
    <div class="ph"><img src="galerie-14.jpg"></div>
    <div class="ph"><img src="galerie-15.jpg"></div>
    <div class="ph"><img src="galerie-16.jpg"></div>
    <div class="ph"><img src="galerie-17.jpg"></div>
    <div class="ph"><img src="galerie-18.jpg"></div>
  </div>

</div>

</body>
</html>
