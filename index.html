<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Festival Franco-Mexicano</title>

<style>
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg,#cdb892,#e6d6b8);
    padding:36px 12px 60px;
  }

  .card{
    max-width:920px;
    margin:0 auto;
    background:#efe4cd;
    border-radius:24px;
    padding:78px 24px 30px;
    position:relative;
    box-shadow:0 20px 40px rgba(0,0,0,.18);
  }

  /* LOGO */
  .logo-wrap{
    position:absolute;
    top:-48px; /* plus haut */
    left:50%;
    transform:translateX(-50%);
    width:108px;   /* un peu plus petit */
    height:108px;
    border-radius:50%;
    overflow:hidden;
    background:#fff;
    box-shadow:0 16px 34px rgba(0,0,0,.22);
    border:5px solid rgba(255,255,255,.95);
  }

  .logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  h1{
    text-align:center;
    margin:8px 0 0;
    color:#24313c;
    font-size:32px;
    letter-spacing:.2px;
  }

  .edition{
    text-align:center;
    color:#666;
    margin:10px 0 18px;
    font-size:14px;
  }

  .btn{
    display:block;
    width:260px;
    margin:18px auto 16px;
    text-align:center;
    background:#2f4050;
    color:#fff;
    padding:12px 14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
  }

  .social{
    text-align:center;
    margin:8px 0 6px;
  }

  .social a{
    display:inline-block;
    background:#f3eadb;
    padding:8px 16px;
    margin:4px;
    border-radius:20px;
    text-decoration:none;
    color:#333;
    font-size:14px;
  }

  .email{
    text-align:center;
    font-size:13px;
    margin:10px 0 18px;
    color:#666;
  }

  .gallery-title{
    text-align:center;
    color:#666;
    margin:0 0 14px;
    font-size:14px;
  }

  /* GALERIE PLUS PETITE ET PROPRE */
  .grid{
    max-width:760px;              /* réduit la largeur totale */
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }

  .ph{
    border-radius:14px;
    overflow:hidden;
    background:#ddd;
    height:145px;                 /* hauteur fixe plus petite */
    box-shadow:0 10px 20px rgba(0,0,0,.12);
  }

  .ph img{
    width:100%;
    height:100%;
    object-fit:cover;             /* évite les déformations */
    display:block;
  }

  @media(max-width:800px){
    .card{
      padding:74px 18px 26px;
    }

    .grid{
      max-width:100%;
      grid-template-columns:repeat(2,1fr);
    }

    .ph{
      height:150px;
    }

    h1{
      font-size:28px;
    }
  }

  @media(max-width:500px){
    .grid{
      grid-template-columns:1fr;
    }

    .ph{
      height:170px;
    }

    .btn{
      width:100%;
      max-width:280px;
    }
  }
</style>
</head>
