<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Festival Franco-Mexicano</title>

  <style>
    :root{
      --bg1:#cdb892;
      --bg2:#e6d6b8;
      --card:#efe4cd;
      --text:#24313c;
      --muted:#6b6b6b;
      --btn:#2f4050;
      --shadow:0 20px 40px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(var(--bg1),var(--bg2));
      color:var(--text);
    }

    .card{
      max-width:980px;
      margin:60px auto;
      background:var(--card);
      border-radius:22px;
      padding:86px 20px 30px;
      position:relative;
      box-shadow:var(--shadow);
    }

    .logo-wrap{
      position:absolute;
      top:-62px;
      left:50%;
      transform:translateX(-50%);
      width:132px;
      height:132px;
      border-radius:50%;
      overflow:hidden;
      background:#fff;
      box-shadow:0 18px 40px rgba(0,0,0,.25);
      display:flex;
      align-items:center;
      justify-content:center;
      border:6px solid rgba(255,255,255,.9);
      pointer-events:none;
    }

    .logo{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    h1{
      text-align:center;
      margin:10px 0 0;
      font-size:42px;
      letter-spacing:.2px;
    }

    .edition{
      text-align:center;
      color:var(--muted);
      margin:10px 0 18px;
      font-size:14px;
    }

    .btn{
      display:block;
      width:280px;
      margin:18px auto 14px;
      text-align:center;
      background:var(--btn);
      color:#fff;
      padding:12px 14px;
      border-radius:12px;
      text-decoration:none;
      font-weight:bold;
      box-shadow:0 10px 22px rgba(0,0,0,.14);
    }

    .social{
      text-align:center;
      margin:10px 0 6px;
    }

    .social a{
      display:inline-block;
      background:#f3eadb;
      padding:8px 16px;
      margin:4px;
      border-radius:20px;
      text-decoration:none;
      color:#333;
      box-shadow:0 8px 18px rgba(0,0,0,.08);
    }

    .email{
      text-align:center;
      font-size:13px;
      margin:10px 0 18px;
      color:var(--muted);
    }

    .section-title{
      text-align:center;
      color:var(--muted);
      margin:0 0 14px;
      font-size:14px;
    }

    /* VIDEO */
    .video-wrap{
      max-width:560px;
      margin:0 auto 26px;
      display:none;
    }

    .video-box{
      position:relative;
      width:100%;
      aspect-ratio:16 / 9;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 14px 30px rgba(0,0,0,.18);
      background:#000;
    }

    .video-box iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .ph{
      border-radius:14px;
      overflow:hidden;
      background:#ddd;
      aspect-ratio:16/9;
      box-shadow:0 10px 20px rgba(0,0,0,.12);
    }

    .ph img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    @media (max-width:800px){
      h1{font-size:34px}
      .grid{grid-template-columns:repeat(2,1fr);}
      .btn{width:260px}
    }

    @media (max-width:500px){
      .card{margin:30px 12px; padding-top:92px;}
      .logo-wrap{top:-70px;}
      .grid{grid-template-columns:1fr;}
      .btn{width:100%; max-width:320px;}
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="logo-wrap">
      <img class="logo" src="LOGO.jpg" alt="Festival Franco-Mexicano">
    </div>

    <h1>Festival Franco-Mexicano</h1>
    <div class="edition">20ª edición</div>

    <a class="btn" href="P1%20FEST.pdf" target="_blank" rel="noopener noreferrer">
      Abrir la presentación (PDF)
    </a>

    <div class="social">
      <a href="https://www.instagram.com/festivalfrancomexicano" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://x.com/festivalfrances" target="_blank" rel="noopener noreferrer">X</a>
      <a href="https://www.facebook.com/share/17njmKGrgN/" target="_blank" rel="noopener noreferrer">Facebook</a>
    </div>

    <div class="email">festival.frances@gmail.com</div>

    <div class="section-title" id="video-title" style="display:none;">Video</div>

    <div class="video-wrap" id="video-wrap">
      <div class="video-box" id="video-box"></div>
    </div>

    <div class="section-title">Galería de fotos</div>

    <div class="grid">
      <div class="ph"><img src="galerie-01.jpg" alt=""></div>
      <div class="ph"><img src="galerie-02.jpg" alt=""></div>
      <div class="ph"><img src="galerie-03.jpg" alt=""></div>
      <div class="ph"><img src="galerie-04.jpg" alt=""></div>
      <div class="ph"><img src="galerie-05.jpg" alt=""></div>
      <div class="ph"><img src="galerie-06.jpg" alt=""></div>
      <div class="ph"><img src="galerie-07.jpg" alt=""></div>
      <div class="ph"><img src="galerie-08.jpg" alt=""></div>
      <div class="ph"><img src="galerie-09.jpg" alt=""></div>
    </div>

  </div>

  <script>
    const YOUTUBE_URL = "https://m.youtube.com/shorts/bL5lLWIeA1Y";

    function extractYouTubeId(url){
      if(!url || url.includes("https://m.youtube.com/shorts/bL5lLWIeA1Y")) return null;

      try{
        const u = new URL(url);

        if(u.hostname.includes("youtu.be")){
          return u.pathname.replace("/", "").trim() || null;
        }

        if(u.hostname.includes("youtube.com")){
          const v = u.searchParams.get("v");
          if(v) return v;

          const parts = u.pathname.split("/");
          const embedIndex = parts.indexOf("embed");
          if(embedIndex !== -1 && parts[embedIndex + 1]) return parts[embedIndex + 1];

          const shortsIndex = parts.indexOf("shorts");
          if(shortsIndex !== -1 && parts[shortsIndex + 1]) return parts[shortsIndex + 1];
        }
      } catch(e){
        return null;
      }

      return null;
    }

    const id = extractYouTubeId(YOUTUBE_URL);

    if(id){
      const wrap = document.getElementById("video-wrap");
      const box = document.getElementById("video-box");
      const title = document.getElementById("video-title");

      box.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
      wrap.style.display = "block";
      title.style.display = "block";
    }
  </script>
</body>
</html>
