<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Festival Franco-Mexicano</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(#cdb892,#e6d6b8);
}

/* CARTE */
.card{
  max-width:900px;
  margin:80px auto;
  background:#efe4cd;
  border-radius:20px;
  padding:120px 20px 30px;
  text-align:center;
  position:relative;
}

/* LOGO ROND (PLUS BAS ET PROPRE) */
.logo-wrap{
  position:absolute;
  top:-50px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  background:#fff;
}

.logo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TITRE */
h1{
  margin:0;
  font-size:36px;
}

/* EDITION */
.edition{
  color:#666;
  margin:10px 0 20px;
}

/* BOUTON */
.btn{
  display:inline-block;
  background:#2f4050;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  text-decoration:none;
  margin-bottom:20px;
}

/* SOCIAL */
.social a{
  display:inline-block;
  margin:5px;
  padding:8px 14px;
  background:#f3eadb;
  border-radius:20px;
  text-decoration:none;
  color:#333;
}

/* GALERIE */
.grid{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.grid img{
  width:100%;
  border-radius:10px;
}

@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr);}
}
</style>

</head>

<body>

<div class="card">

<div class="logo-wrap">
  <img class="logo" src="LOGO.jpg">
</div>

<h1>Festival Franco-Mexicano</h1>
<div class="edition">20ª edición</div>

<a class="btn" href="P1 FEST.pdf" target="_blank">
Abrir la presentación (PDF)
</a>

<div class="social">
  <a href="https://www.instagram.com/festivalfrancomexicano" target="_blank">Instagram</a>
  <a href="https://x.com/festivalfrances" target="_blank">X</a>
  <a href="https://www.facebook.com/share/17njmKGrgN/" target="_blank">Facebook</a>
</div>

<div class="grid">
  <img src="galerie-01.jpg">
  <img src="galerie-02.jpg">
  <img src="galerie-03.jpg">
  <img src="galerie-04.jpg">
  <img src="galerie-05.jpg">
  <img src="galerie-06.jpg">
  <img src="galerie-07.jpg">
  <img src="galerie-08.jpg">
  <img src="galerie-09.jpg">
</div>

</div>

</body>
</html>
