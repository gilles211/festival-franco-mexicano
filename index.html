<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Festival Franco-Mexicano</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(#cdb892,#e6d6b8);
}

.card{
  max-width:1000px;
  margin:60px auto;
  background:#efe4cd;
  border-radius:20px;
  padding:90px 20px 30px;
  position:relative;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* LOGO PROPRE */
.logo-wrap{
  position:absolute;
  top:-65px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  overflow:hidden;
  background:white;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.logo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TITRES */
h1{
  text-align:center;
  margin:10px 0;
}

.edition{
  text-align:center;
  color:#666;
}

/* BOUTON */
.btn{
  display:block;
  width:260px;
  margin:20px auto;
  text-align:center;
  background:#2f4050;
  color:white;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
}

/* SOCIAL */
.social{
  text-align:center;
  margin:10px 0;
}

.social a{
  display:inline-block;
  background:#f3eadb;
  padding:8px 14px;
  margin:4px;
  border-radius:20px;
  text-decoration:none;
  color:#333;
}

/* EMAIL */
.email{
  text-align:center;
  font-size:13px;
  color:#666;
}

/* GALERIE */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:20px;
}

.ph{
  border-radius:14px;
  overflow:hidden;
  background:#ddd;
}

.ph img{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<div class="card">

<div class="logo-wrap">
  <img class="logo" src="LOGO.jpg">
</div>

<h1>Festival Franco-Mexicano</h1>
<div class="edition">20ª edición</div>

<a class="btn" href="P1 FEST.pdf" target="_blank">
Abrir la presentación (PDF)
</a>

<div class="social">
  <a href="https://www.instagram.com/festivalfrancomexicano" target="_blank">Instagram</a>
  <a href="https://x.com/festivalfrances" target="_blank">X</a>
  <a href="https://www.facebook.com/share/17njmKGrgN/" target="_blank">Facebook</a>
</div>

<div class="email">festival.frances@gmail.com</div>

<div style="text-align:center;color:#666;margin-top:10px;">
Galería de fotos
</div>

<div class="grid">
  <div class="ph"><img src="galerie-01.jpg"></div>
  <div class="ph"><img src="galerie-02.jpg"></div>
  <div class="ph"><img src="galerie-03.jpg"></div>
  <div class="ph"><img src="galerie-04.jpg"></div>
  <div class="ph"><img src="galerie-05.jpg"></div>
  <div class="ph"><img src="galerie-06.jpg"></div>
  <div class="ph"><img src="galerie-07.jpg"></div>
  <div class="ph"><img src="galerie-08.jpg"></div>
  <div class="ph"><img src="galerie-09.jpg"></div>
</div>

</div>

</body>
</html>
