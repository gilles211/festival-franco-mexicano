<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festival Franco-Mexicano</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(#cdb892,#e6d6b8);
}

.card{
  max-width:900px;
  margin:60px auto;
  background:#efe4cd;
  border-radius:20px;
  padding:90px 20px 30px;
  position:relative;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* LOGO */
.logo-wrap{
  position:absolute;
  top:-65px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  overflow:hidden;
  background:#fff;
}

.logo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TITRES */
h1{
  text-align:center;
  margin:10px 0;
}

.edition{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

/* BOUTON */
.btn{
  display:block;
  width:260px;
  margin:20px auto;
  text-align:center;
  background:#2f4050;
  color:#fff;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
}

/* SOCIAL */
.social{
  text-align:center;
