<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festival Franco-Mexicano</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(#cdb892,#e6d6b8);
}

.card{
  max-width:980px;
  margin:60px auto;
  background:#efe4cd;
  border-radius:22px;
  padding:90px 20px 30px;
  position:relative;
}

.logo-wrap{
  position:absolute;
  top:-60px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  overflow:hidden;
  background:#fff;
}

.logo{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{text-align:center;}
.edition{text-align:center;color:#666;}

.btn{
  display:block;
  width:260px;
  margin:20px auto;
  text-align:center;
  background:#2f4050;
  color:#fff;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
}

.social{text-align:center;}
.social a{
  display:inline-block;
  background:#f3eadb;
  padding:8px 16px;
  margin:4px;
  border-radius:20px;
  text-decoration:none;
  color:#333;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.ph{
  border-radius:14px;
  overflow:hidden;
  background:#ddd;
  aspect-ratio:16/9;
}

.ph img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* YOUTUBE */
.video{
  margin:30px auto;
  max-width:800px;
}
.video iframe{
  width:100%;
  height:450px;
  border:none;
  border-radius:14px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo-wrap">
  <img class="logo" src="LOGO.jpg">
</div>

<h1>Festival Franco-Mexicano</h1>
<div class="edition">20ª edición</div>

<a class="btn" href="P1 FEST.pdf" target="_blank">
Abrir la presentación (PDF)
</a>

<div class="social">
  <a href="https://www.instagram.com/festivalfrancomexicano">Instagram</a>
  <a href="https://x.com/festivalfrances">X</a>
  <a href="https://www.facebook.com/share/17njmKGrgN/">Facebook</a>
</div>

<!-- 🔥 YOUTUBE ICI -->
<div class="video">
  <iframe src="https://www.youtube.com/embed/VIDEO_ID"></iframe>
</div>

<div class="grid">
  <div class="ph"><img src="galerie-01.jpg"></div>
  <div class="ph"><img src="galerie-02.jpg"></div>
  <div class="ph"><img src="galerie-03.jpg"></div>
  <div class="ph"><img src="galerie-04.jpg"></div>
  <div class="ph"><img src="galerie-05.jpg"></div>
  <div class="ph"><img src="galerie-06.jpg"></div>
  <div class="ph"><img src="galerie-07.jpg"></div>
  <div class="ph"><img src="galerie-08.jpg"></div>
  <div class="ph"><img src="galerie-09.jpg"></div>
</div>

</div>

</body>
</html>
